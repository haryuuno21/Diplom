services:
  postgres:
    image: postgres:16
    container_name: diplom-game-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - diplom_game_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: diplom-game-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - diplom_game_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  diplom_game_postgres_data:
  diplom_game_redis_data:
