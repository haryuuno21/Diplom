<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <title>BASIC Sandbox Auth</title>
</head>
<body>
    <header class="auth-header">Basic Sandbox</header>

    <main class="auth-layout">
        <section class="auth-intro">
            <h1>BASIC Sandbox</h1>
        </section>

        <section class="auth-card">
            <div class="auth-tabs">
                <button class="tab-button active" id="showLoginBtn" type="button">Вход</button>
                <button class="tab-button" id="showRegisterBtn" type="button">Регистрация</button>
            </div>

            <div id="loginForm" class="auth-form active">
                <h2>Войти в аккаунт</h2>
                <form id="loginFormElement" class="stack-form">
                    <label class="field">
                        <span>Логин</span>
                        <input type="text" id="loginUsername" placeholder="robot_builder" required>
                    </label>
                    <label class="field">
                        <span>Пароль</span>
                        <input type="password" id="loginPassword" placeholder="Введите пароль" required>
                    </label>
                    <button class="primary-button" type="submit">Войти</button>
                </form>
                <div id="loginError" class="inline-message error"></div>
            </div>

            <div id="registerForm" class="auth-form">
                <h2>Создать аккаунт</h2>
                <form id="registerFormElement" class="stack-form">
                    <label class="field">
                        <span>Логин</span>
                        <input type="text" id="registerUsername" minlength="3" maxlength="50" placeholder="basic_master" required>
                    </label>
                    <label class="field">
                        <span>Пароль</span>
                        <input type="password" id="registerPassword" minlength="6" placeholder="Не менее 6 символов" required>
                    </label>
                    <label class="field">
                        <span>Подтвердите пароль</span>
                        <input type="password" id="registerConfirmPassword" minlength="6" placeholder="Повторите пароль" required>
                    </label>
                    <button class="primary-button" type="submit">Зарегистрироваться</button>
                </form>
                <div id="registerError" class="inline-message error"></div>
            </div>
        </section>
    </main>

    <script type="module" src="/js/login.js"></script>
</body>
</html>
