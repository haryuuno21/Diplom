<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="css/login.css">
    <title>Programming Sandbox</title>
</head>
<body>
    <header>ProgCraft</header>
    
    <main class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Добро пожаловать!</h1>
            
            <!-- Форма входа -->
            <div id="loginForm" class="auth-form active">
                <h2>Вход</h2>
                <form id="loginFormElement">
                    <div class="form-group">
                        <input type="text" id="loginUsername" placeholder="Имя пользователя" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="loginPassword" placeholder="Пароль" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Войти</button>
                </form>
                <p class="switch-text">
                    Нет аккаунта? 
                    <button type="button" class="link-btn" onclick="showForm('register')">Зарегистрироваться</button>
                </p>
                <div id="loginError" class="error-message"></div>
            </div>

            <!-- Форма регистрации -->
            <div id="registerForm" class="auth-form">
                <h2>Регистрация</h2>
                <form id="registerFormElement">
                    <div class="form-group">
                        <input type="text" id="registerUsername" placeholder="Имя пользователя" required minlength="3" maxlength="20">
                    </div>
                    <div class="form-group">
                        <input type="password" id="registerPassword" placeholder="Пароль" required minlength="6">
                    </div>
                    <div class="form-group">
                        <input type="password" id="registerConfirmPassword" placeholder="Подтвердите пароль" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                </form>
                <p class="switch-text">
                    Уже есть аккаунт? 
                    <button type="button" class="link-btn" onclick="showForm('login')">Войти</button>
                </p>
                <div id="registerError" class="error-message"></div>
            </div>
        </div>
    </main>
</body>
<script src="js/login.js"></script>  
</html>
